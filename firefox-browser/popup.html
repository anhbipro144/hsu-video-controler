<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Arrow Keys</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Video Arrow Keys</h1>
      <p class="description">Control Hoa Sen LMS videos with your keyboard.</p>

      <label class="switch-row" for="enabled">
        <span>Enable shortcuts</span>
        <input id="enabled" type="checkbox">
      </label>

      <label for="seek-seconds">Seek interval</label>
      <select id="seek-seconds">
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
        <option value="15">15 seconds</option>
        <option value="30">30 seconds</option>
      </select>

      <p class="hint"><kbd>←</kbd> back &nbsp; <kbd>→</kbd> forward</p>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
